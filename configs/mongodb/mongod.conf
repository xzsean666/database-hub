# ==============================================================================
# MongoDB 6.x / 7.x Configuration
# database-hub - WiredTiger High Performance Configuration
# ==============================================================================

storage:
  dbPath: /data/db
  directoryPerDB: true
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 2
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  verbosity: 0

net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 10000

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
