# ==============================================================================
# Redis 7.x / 8.x Performance Configuration
# database-hub - Low Latency & High Throughput Optimized
# ==============================================================================

# Network & General
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
databases 16

# Multi-Threaded I/O (Significantly boosts throughput on multi-core systems)
io-threads 4
io-threads-do-reads yes

# Memory Management & Eviction
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy Freeing (Background non-blocking deletions)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Snapshot Persistence (RDB)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only File (AOF) Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
