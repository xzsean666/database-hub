# ==============================================================================
# PostgreSQL Performance Tuning Configuration
# database-hub - Optimized for high throughput on SSD / NVMe
# ==============================================================================

# Network & Connections
listen_addresses = '*'
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 10

# Memory settings (Default values, can be overridden via .env & command flags)
# Note: In docker-compose, shared_buffers, effective_cache_size, work_mem,
# and maintenance_work_mem are dynamically populated from .env if defined.

# Write-Ahead Log (WAL) & Checkpoints
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
min_wal_size = 1GB
max_wal_size = 4GB

# Planner Cost & Disk I/O (Optimized for modern SSD/NVMe storage)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Worker Parallelism
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Logging & Monitoring
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
log_min_duration_statement = 1000  # Log slow queries taking >= 1000ms
